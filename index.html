<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - AGEN WPA SHOP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
        apiKey: "AIzaSyDsz5Y-7PsulS71Z_TiPWbBW3qiMkYFI1g",
        authDomain: "wpashopgrosir-45a9d.firebaseapp.com",
        projectId: "wpashopgrosir-45a9d",
        storageBucket: "wpashopgrosir-45a9d.firebasestorage.app",
        messagingSenderId: "978499317395",
        appId: "1:978499317395:web:91fccc4e5193022f29a766"
      };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.firebaseApp = { db, auth, signInWithEmailAndPassword, onAuthStateChanged, signOut, collection, getDocs };
    </script>
</head>
<body class="bg-slate-100 font-sans antialiased" x-data="posApp()">

    <!-- HALAMAN LOGIN -->
    <div x-show="!isLoggedIn" class="flex items-center justify-center h-screen bg-slate-900">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-slate-800 mb-2 text-center">AGEN WPA SHOP</h2>
            <p class="text-xs text-slate-500 mb-6 text-center">Silakan login untuk mulai kasir</p>
            
            <form @submit.prevent="login()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                    <input type="email" x-model="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" x-model="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">Masuk</button>
            </form>
            <p x-show="loginError" class="text-red-500 text-xs mt-3 text-center" x-text="loginError"></p>
        </div>
    </div>

    <!-- HALAMAN UTAMA KASIR -->
    <div x-show="isLoggedIn" class="flex h-screen overflow-hidden" style="display: none;">
        
        <!-- Bagian Kiri: Katalog & Pencarian Produk -->
        <div class="flex-1 flex flex-col p-4 overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Kasir / Penjualan</h1>
                    <p class="text-xs text-slate-500">AGEN WPA SHOP GROSIR</p>
                </div>
                <div class="flex items-center space-x-3">
                    <span x-show="isFetchingData" class="text-xs text-indigo-600 font-medium animate-pulse">Memuat data produk...</span>
                    <button @click="logout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-red-100">Keluar Akun</button>
                </div>
            </div>

            <!-- Kotak Pencarian dengan Debounce & Loading State -->
            <div class="relative mb-6">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <template x-if="isLoading">
                        <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </template>
                    <template x-if="!isLoading">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </template>
                </div>
                <input 
                    type="text" 
                    x-model="searchQuery" 
                    @input.debounce.300ms="searchProducts()"
                    placeholder="Scan barcode atau ketik nama produk (misal: KITA, SOTO, dll)..." 
                    class="w-full pl-10 pr-36 py-3 bg-white border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-700 font-medium"
                >
                <div class="absolute right-3 top-3 text-xs text-slate-400 flex items-center">
                    <span x-show="isLoading" class="text-indigo-600 font-medium">Mencari...</span>
                </div>
            </div>

            <!-- Daftar Produk Hasil Pencarian -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="product in products" :key="product.id">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-base uppercase" x-text="product.nama"></h3>
                                    <p class="text-xs text-slate-400" x-show="product.isi" x-text="'Isi: ' + product.isi"></p>
                                </div>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded" x-text="'BC: ' + (product.barcode || '-')"></span>
                            </div>
                            
                            <!-- Pilihan Satuan Dinamis (Karton, Slop, Pak, Sak, Bal, Pcs) -->
                            <div class="mt-3 space-y-2">
                                <template x-for="unit in availableUnits">
                                    <template x-if="product[unit.key] && product[unit.key] > 0">
                                        <div class="flex justify-between items-center bg-indigo-50/50 p-2 rounded-lg border border-indigo-100">
                                            <div>
                                                <p class="text-xs font-semibold text-slate-700" x-text="unit.label"></p>
                                                <p class="text-xs text-indigo-600 font-bold" x-text="formatRupiah(product[unit.key])"></p>
                                            </div>
                                            <button @click="addToCart(product, `${product.nama} (${unit.label})`, product[unit.key], unit.label)" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-indigo-700">+ Pilih</button>
                                        </div>
                                    </template>
                                </template>

                                <!-- Harga Variasi (misal: Ecer) -->
                                <template x-for="v in (product.variasi || [])">
                                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                        <div>
                                            <p class="text-xs font-semibold text-slate-700 capitalize" x-text="v.nama"></p>
                                            <p class="text-xs text-emerald-600 font-bold" x-text="formatRupiah(v.harga)"></p>
                                        </div>
                                        <button @click="addToCart(product, `${product.nama} (${v.nama})`, v.harga, v.nama)" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold hover:bg-emerald-700">+ Pilih</button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Pesan Kosong / Awal -->
            <div x-show="products.length === 0 && !isLoading" class="text-center py-12 text-slate-400">
                <p>Silakan ketik nama produk atau scan barcode pada kolom di atas.</p>
            </div>
        </div>

        <!-- Bagian Kanan: Keranjang Belanja -->
        <div class="w-96 bg-white border-l border-slate-200 flex flex-col justify-between p-4 shadow-sm">
            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-4">Keranjang Belanja</h2>
                <div class="space-y-3 overflow-y-auto max-h-[calc(100vh-250px)]">
                    <template x-for="(item, index) in cart" :key="index">
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <div>
                                <h4 class="text-xs font-semibold text-slate-800 uppercase" x-text="item.displayName"></h4>
                                <p class="text-xs text-slate-500" x-text="formatRupiah(item.price) + ' x ' + item.qty"></p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button @click="decreaseQty(index)" class="bg-slate-200 text-slate-600 w-6 h-6 rounded flex items-center justify-center font-bold text-xs">-</button>
                                <span class="text-xs font-semibold" x-text="item.qty"></span>
                                <button @click="increaseQty(index)" class="bg-slate-200 text-slate-600 w-6 h-6 rounded flex items-center justify-center font-bold text-xs">+</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Total dan Tombol Checkout -->
            <div class="border-t border-slate-200 pt-4">
                <div class="flex justify-between mb-4">
                    <span class="font-bold text-slate-700">Total:</span>
                    <span class="font-extrabold text-indigo-600 text-lg" x-text="formatRupiah(calculateTotal())"></span>
                </div>
                <button @click="checkout()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition">Bayar / Selesaikan Transaksi</button>
            </div>
        </div>
    </div>

    <!-- Skrip Aplikasi -->
    <script>
        function posApp() {
            return {
                isLoggedIn: false,
                email: '',
                password: '',
                loginError: '',
                searchQuery: '',
                products: [],
                allProducts: [],
                cart: [],
                isLoading: false,
                isFetchingData: false,
                
                // Satuan lengkap gudang grosir
                availableUnits: [
                    { key: 'karton', label: 'Karton' },
                    { key: 'slop', label: 'Slop' },
                    { key: 'pak', label: 'Pak' },
                    { key: 'sak', label: 'Sak' },
                    { key: 'bal', label: 'Bal' },
                    { key: 'pcs', label: 'Pcs' }
                ],

                init() {
                    setTimeout(() => {
                        const { auth, onAuthStateChanged } = window.firebaseApp;
                        onAuthStateChanged(auth, async (user) => {
                            if (user) {
                                this.isLoggedIn = true;
                                await this.loadAllProducts();
                            } else {
                                this.isLoggedIn = false;
                                this.allProducts = [];
                            }
                        });
                    }, 500);
                },

                // Tarik seluruh data produk sekali saat login agar pencarian instan dan akurat
                async loadAllProducts() {
                    if (this.allProducts.length > 0) return;
                    this.isFetchingData = true;
                    try {
                        const { db, collection, getDocs } = window.firebaseApp;
                        const querySnapshot = await getDocs(collection(db, "produk"));
                        let temp = [];
                        querySnapshot.forEach((doc) => {
                            temp.push({ id: doc.id, ...doc.data() });
                        });
                        this.allProducts = temp;
                    } catch (error) {
                        console.error("Gagal memuat database produk:", error);
                    } finally {
                        this.isFetchingData = false;
                    }
                },

                async login() {
                    this.loginError = '';
                    try {
                        const { auth, signInWithEmailAndPassword } = window.firebaseApp;
                        await signInWithEmailAndPassword(auth, this.email, this.password);
                        this.isLoggedIn = true;
                        await this.loadAllProducts();
                    } catch (error) {
                        this.loginError = "Gagal login: " + error.message;
                    }
                },

                async logout() {
                    const { auth, signOut } = window.firebaseApp;
                    await signOut(auth);
                    this.isLoggedIn = false;
                    this.cart = [];
                    this.products = [];
                    this.allProducts = [];
                    this.searchQuery = '';
                },

                // Pencarian dari memori lokal (mendukung kata di tengah seperti "KITA")
                searchProducts() {
                    const keyword = this.searchQuery.trim().toLowerCase();
                    if (!keyword) {
                        this.products = [];
                        this.isLoading = false;
                        return;
                    }

                    this.isLoading = true;

                    let matchedProducts = [];
                    for (let product of this.allProducts) {
                        const nama = (product.nama || "").toLowerCase();
                        const barcode = (product.barcode || "").toLowerCase();
                        
                        const matchBarcode = barcode === keyword;
                        const matchName = nama.includes(keyword); // Pencarian kata di tengah / substring
                        
                        let matchVariasi = false;
                        if (product.variasi && Array.isArray(product.variasi)) {
                            matchVariasi = product.variasi.some(v => 
                                (v.nama || "").toLowerCase().includes(keyword) || 
                                (v.barcode || "").toLowerCase() === keyword
                            );
                        }

                        if (matchBarcode || matchName || matchVariasi) {
                            matchedProducts.push(product);
                        }
                        
                        if (matchedProducts.length >= 15) break; // Batasi maksimal 15 hasil tampil
                    }

                    this.products = matchedProducts;
                    this.isLoading = false;
                },

                addToCart(product, displayName, price, type) {
                    let cartItemId = `${product.id}-${type}`;
                    let existing = this.cart.find(item => item.cartItemId === cartItemId);
                    if (existing) {
                        existing.qty++;
                    } else {
                        this.cart.push({
                            cartItemId: cartItemId,
                            productId: product.id,
                            displayName: displayName,
                            price: price,
                            qty: 1
                        });
                    }
                },

                increaseQty(index) {
                    this.cart[index].qty++;
                },

                decreaseQty(index) {
                    if (this.cart[index].qty > 1) {
                        this.cart[index].qty--;
                    } else {
                        this.cart.splice(index, 1);
                    }
                },

                calculateTotal() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                },

                formatRupiah(number) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
                },

                checkout() {
                    if (this.cart.length === 0) {
                        alert("Keranjang masih kosong!");
                        return;
                    }
                    alert("Transaksi berhasil disimpan!");
                    this.cart = [];
                }
            }
        }
    </script>
</body>
</html>
